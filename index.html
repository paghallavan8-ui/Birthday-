<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday Anantha Jothi ❤️</title><style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffd1dc, #ffe6f0);
    overflow: hidden;
  }

  .card {
    background: white;
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    max-width: 500px;
    text-align: center;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: fadeIn 2s ease-in-out;
  }

  h1 {
    color: #d63384;
    font-size: 42px;
  }

  p {
    font-size: 18px;
    color: #555;
  }

  button {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    background: #ff4d88;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s ease;
  }

  button:hover {
    background: #e6005c;
  }

  #surprise {
    display: none;
    margin-top: 20px;
    font-size: 20px;
    color: #c2185b;
  }

  .heart {
    position: absolute;
    color: red;
    animation: fall linear infinite;
  }

  @keyframes fall {
    0% {
      transform: translateY(-10vh);
      opacity: 1;
    }
    100% {
      transform: translateY(110vh);
      opacity: 0;
    }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translate(-50%, -40%);} 
    to { opacity: 1; transform: translate(-50%, -50%);} 
  }
</style></head><body><div class="card">
  <h1>Happy Birthday Anantha Jothi 🎂❤️</h1>  <p>
    To the most special person in my life,
    your smile makes my world brighter every day.
    I am so lucky to have you. 💖
  </p><button onclick="showMessage()">Click for Surprise 🎁</button>

  <div id="surprise">
    I love you more than words can describe ❤️✨
  </div>
</div><audio autoplay loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3" type="audio/mpeg">
</audio><script>
function showMessage() {
  document.getElementById("surprise").style.display = "block";
}

function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = Math.random() * 3 + 3 + "s";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 5000);
}

setInterval(createHeart, 300);
</script></body>
</html>
